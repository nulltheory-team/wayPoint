name: Release

# Publishes a release whenever the version in app/build.gradle.kts changes.
#
# "Has the version changed?" is answered by asking whether the tag v<version> already exists,
# rather than by diffing against the previous commit. That is deliberate: tag existence is
# idempotent, so re-runs, squash merges, reverts and force pushes all behave sensibly, and a
# release can never be published twice for the same version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the tag already exists (deletes and recreates it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      version_code: ${{ steps.read.outputs.version_code }}
      should_release: ${{ steps.decide.outputs.should_release }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: read
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)

          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Found version $VERSION (code $VERSION_CODE)"

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          VERSION="${{ steps.read.outputs.version }}"
          TAG="v$VERSION"

          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "### No release: \`$TAG\` already exists" >> "$GITHUB_STEP_SUMMARY"
            echo "Bump \`versionName\` in \`app/build.gradle.kts\` to publish a new one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "### Releasing \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Previous tag: \`${PREVIOUS_TAG:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A broken build must never reach a release page.
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build release APK
        env:
          # Passed as env rather than interpolated into the script, so key material never
          # reaches a command line and an awkward character cannot break the shell.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WAYPOINT_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "SIGNED_WITH=release keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set — the APK will be debug-signed."
            echo "SIGNED_WITH=debug key (no release keystore configured)" >> "$GITHUB_ENV"
          fi

          ./gradlew assembleRelease --stacktrace

      - name: Stage the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          if [ -z "$SRC" ]; then
            echo "::error::No APK produced by assembleRelease"
            exit 1
          fi

          mkdir -p dist
          DEST="dist/waypoint-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          PREVIOUS_TAG="${{ needs.check.outputs.previous_tag }}"

          # A hand-written CHANGELOG.md section wins over generated commit history.
          #
          # Matching is done by normalising each heading and comparing strings, not with a
          # dynamic regex: building one from the version puts "[" and "." into a pattern,
          # where an awk string literal quietly drops the backslash and turns "\[" into a
          # character class. That silently matches *every* "## " heading, folding the previous
          # release's notes into this one.
          SECTION=""
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                heading = $0
                sub(/^## +/, "", heading)
                gsub(/[][]/, "", heading)      # drop [ and ]
                sub(/^v/, "", heading)
                split(heading, parts, /[ \t]/) # tolerate "0.2.0 - 2026-09-06"
                if (parts[1] == v) found = 1
                next
              }
              found { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' || true)
          fi

          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "### Changes"
              echo
              if [ -n "$PREVIOUS_TAG" ]; then
                git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (%h)'
              else
                git log --no-merges --pretty=format:'- %s (%h)'
              fi
              echo
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "adb install -r waypoint-${VERSION}.apk"
            echo "adb shell appops set in.nulltheory.waypoint android:mock_location allow"
            echo '```'
            echo
            echo "The mock location appop is reset on every reinstall, so the second line is not optional."
            echo
            echo "Signed with: ${SIGNED_WITH}"
            echo
            echo "\`sha256\`: \`${{ steps.apk.outputs.sha256 }}\`"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full diff**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${VERSION}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Waypoint ${{ needs.check.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          # A version containing a hyphen (0.2.0-beta, 1.0.0-rc1) is a pre-release.
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          make_latest: ${{ contains(needs.check.outputs.version, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "## Released Waypoint ${{ needs.check.outputs.version }}"
            echo
            echo "- Version code: ${{ needs.check.outputs.version_code }}"
            echo "- APK: \`$(basename '${{ steps.apk.outputs.path }}')\`"
            echo "- Signed with: ${SIGNED_WITH}"
            echo "- sha256: \`${{ steps.apk.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

# One workflow, one run per push.
#
# Build/test/lint and release live together on purpose: as two separate workflows both
# triggered by `push: main`, every push started two runs and a version-bump push compiled and
# tested the project twice. Here the release job simply depends on the build job, so the tests
# gate the release without being run again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish even if the tag for the current version already exists"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; a push to main may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  version:
    name: Check version
    # Pull requests never publish, so do not even ask.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      version_code: ${{ steps.read.outputs.version_code }}
      should_release: ${{ steps.decide.outputs.should_release }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: read
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)

          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Found version $VERSION (code $VERSION_CODE)"

      # "Has the version changed?" is answered by asking whether the tag already exists,
      # rather than by diffing the previous commit. Tag existence is idempotent, so re-runs,
      # squash merges, reverts and force pushes all behave sensibly, and the same version can
      # never be published twice.
      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          VERSION="${{ steps.read.outputs.version }}"
          TAG="v$VERSION"

          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ inputs.force_release }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "### No release: \`$TAG\` already exists" >> "$GITHUB_STEP_SUMMARY"
            echo "Bump \`versionName\` in \`app/build.gradle.kts\` to publish a new one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "### Releasing \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Previous tag: \`${PREVIOUS_TAG:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish release
    # Tests and lint have already passed in `build`; this job only packages and publishes.
    needs: [build, version]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          # Passed as env rather than interpolated into the script, so key material never
          # reaches a command line and an awkward character cannot break the shell.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WAYPOINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WAYPOINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WAYPOINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WAYPOINT_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "SIGNED_WITH=release keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret set — the APK will be debug-signed."
            echo "SIGNED_WITH=debug key (no release keystore configured)" >> "$GITHUB_ENV"
          fi

          ./gradlew assembleRelease --stacktrace

      - name: Stage the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          if [ -z "$SRC" ]; then
            echo "::error::No APK produced by assembleRelease"
            exit 1
          fi

          mkdir -p dist
          DEST="dist/waypoint-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PREVIOUS_TAG="${{ needs.version.outputs.previous_tag }}"

          # A hand-written CHANGELOG.md section wins over generated commit history.
          #
          # Matching normalises each heading and compares strings rather than building a
          # dynamic regex from the version: an awk string literal quietly drops the backslash
          # in "\[", turning it into a character class that matches *every* "## " heading and
          # folds the previous release's notes into this one.
          SECTION=""
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v v="$VERSION" '
              /^## / {
                if (found) exit
                heading = $0
                sub(/^## +/, "", heading)
                gsub(/[][]/, "", heading)      # drop [ and ]
                sub(/^v/, "", heading)
                split(heading, parts, /[ \t]/) # tolerate "0.2.0 - 2026-09-06"
                if (parts[1] == v) found = 1
                next
              }
              found { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' || true)
          fi

          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "### Changes"
              echo
              if [ -n "$PREVIOUS_TAG" ]; then
                git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (%h)'
              else
                git log --no-merges --pretty=format:'- %s (%h)'
              fi
              echo
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "adb install -r waypoint-${VERSION}.apk"
            echo "adb shell appops set in.nulltheory.waypoint android:mock_location allow"
            echo '```'
            echo
            echo "The mock location appop is reset on every reinstall, so the second line is not optional."
            echo
            echo "Signed with: ${SIGNED_WITH}"
            echo
            echo "\`sha256\`: \`${{ steps.apk.outputs.sha256 }}\`"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full diff**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREVIOUS_TAG}...v${VERSION}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Waypoint ${{ needs.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: ${{ steps.apk.outputs.path }}
          # A version containing a hyphen (0.2.0-beta, 1.0.0-rc1) is a pre-release.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ contains(needs.version.outputs.version, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "## Released Waypoint ${{ needs.version.outputs.version }}"
            echo
            echo "- Version code: ${{ needs.version.outputs.version_code }}"
            echo "- APK: \`$(basename '${{ steps.apk.outputs.path }}')\`"
            echo "- Signed with: ${SIGNED_WITH}"
            echo "- sha256: \`${{ steps.apk.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
